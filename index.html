<script>
/* طبقة الاتصال بقاعدة البيانات المشتركة (Cloudflare KV عبر /api) */
(function(){
var API='/api/',H={'content-type':'application/json'},POLL=10000;
function j(u,o){return fetch(u,o).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
var inflight=0,lastW=0,dirty=false,subs=[],last={},timer=null,kt=null;
function track(p){inflight++;lastW=Date.now();return p.then(function(x){inflight--;lastW=Date.now();return x},function(e){inflight--;lastW=Date.now();throw e})}
function busy(){return dirty||inflight>0||Date.now()-lastW<2500}
function apply(all){subs.forEach(function(s){var v=s.pick(all),k=JSON.stringify(v);if(k!==last[s.id]){last[s.id]=k;s.cb(s.mk(v))}})}
function pull(force){if(!force&&(document.hidden||busy()))return;j(API+'all').then(function(all){if(!force&&busy())return;apply(all)}).catch(function(){})}
function kick(){clearTimeout(kt);kt=setTimeout(function(){pull(true)},30);if(!timer)timer=setInterval(function(){pull(false)},POLL)}
document.addEventListener('visibilitychange',function(){if(!document.hidden)pull(false)});
function sub(id,pick,mk,cb){subs.push({id:id,pick:pick,mk:mk,cb:cb});kick()}
var coreData=null,coreTimer=null,corePromise=null,coreRes=null,coreRej=null;
function flushCore(){
  if(coreData===null)return;
  var d=coreData,res=coreRes,rej=coreRej;coreData=null;corePromise=null;clearTimeout(coreTimer);
  track(j(API+'core',{method:'PUT',headers:H,body:JSON.stringify(d)})).then(function(){dirty=coreData!==null;res()},function(e){dirty=coreData!==null;rej(e)});
}
function setCore(d){
  coreData=d;dirty=true;
  if(!corePromise)corePromise=new Promise(function(a,b){coreRes=a;coreRej=b});
  clearTimeout(coreTimer);coreTimer=setTimeout(flushCore,1200);
  return corePromise;
}
document.addEventListener('visibilitychange',function(){if(document.hidden)flushCore()});
window.addEventListener('pagehide',flushCore);
var db={
  doc:function(p){
    if(p==='app/core')return{
      set:setCore,
      onSnapshot:function(cb){sub('core',function(a){return a.core},function(v){return{exists:!!v,data:function(){return v}}},cb)}
    };
    var a=p.split('/'),u=API+'col/'+a[0]+'/'+encodeURIComponent(a[1]);
    return{
      set:function(d){return track(j(u,{method:'PUT',headers:H,body:JSON.stringify(d)}))},
      update:function(d){return track(j(u,{method:'PATCH',headers:H,body:JSON.stringify(d)}))}
    };
  },
  collection:function(n){return{onSnapshot:function(cb){
    sub(n,function(a){return a[n]||[]},function(v){return{docs:v.map(function(d){return{data:function(){return d}}})}},cb)
  }}}
};
window.claude={use:function(n){
  if(n==='db')return j(API+'all').then(function(){return db}).catch(function(){return null});
  return Promise.resolve(null);
}};
})();
</script>

<style>
:root{--bg:#f6f4ee;--card:rgba(255,255,255,.92);--tx:#1d2b24;--mu:#5d6c64;--pr:#1f6b4f;--pr2:#e3f1ea;--bd:#dcd8cc;--bad:#b3392f;--in:#fff;

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121915;--card:rgba(27,38,32,.92);--tx:#e8efe9;--mu:#a3b3aa;--pr:#4fb48a;--pr2:#223b30;--bd:#2d3b33;--bad:#e5766c;--in:#121915}}
:root[data-theme="dark"]{--bg:#121915;--card:rgba(27,38,32,.92);--tx:#e8efe9;--mu:#a3b3aa;--pr:#4fb48a;--pr2:#223b30;--bd:#2d3b33;--bad:#e5766c;--in:#121915}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;font-size:15px;min-height:100vh}
.bg,.bg i{position:fixed;inset:0;z-index:-2}
.bg i{inset:-6px;background-size:cover;background-position:center;opacity:0;filter:blur(.5px);transition:opacity 1s ease}
.bg i.on{opacity:1;animation:kb 3.6s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.04)}}
.shade{position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(10,30,20,.64),rgba(10,30,20,.8))}
@media(prefers-reduced-motion:reduce){.bg i.on{animation:none}}
.w{max-width:900px;margin:0 auto;padding:12px}
h1{font-size:22px;margin:10px 0 12px;text-align:center;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:12px;backdrop-filter:blur(6px)}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;padding:11px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:700}
.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.row label{color:var(--mu);font-size:13px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:8px;min-width:0}
textarea{width:100%;min-height:70px}
input.n{width:70px}input.g{flex:1;min-width:120px}
.b{border:0;background:var(--pr);color:#fff;border-radius:8px;padding:8px 12px;font:inherit;font-weight:700}
.b.s{background:var(--pr2);color:var(--pr)}
.big{display:block;width:100%;padding:16px;margin-bottom:10px;font-size:18px;border-radius:12px}
.sum{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--mu)}.sum b{color:var(--pr)}
.ov{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{border-bottom:1px solid var(--bd);padding:6px 4px;text-align:right;vertical-align:middle}
th{background:var(--pr2);color:var(--pr);font-size:13px}
td input{width:100%}
.gh td{background:var(--pr2);font-weight:700;color:var(--pr)}
.st{border:1px solid var(--bd);background:var(--in);color:var(--mu);border-radius:8px;padding:6px 8px;font:inherit;min-width:64px}
.st.a1{background:#d9f0e3;color:#14633f;border-color:#9fd4b6}.st.a2{background:#fff0c9;color:#7a5600;border-color:#e6cd82}
.st.a3{background:#dbe8fb;color:#1f4f8f;border-color:#a9c4ee}.st.a4{background:#fbdcd8;color:#9b2c22;border-color:#e8a8a1}
.ac{white-space:nowrap}
.ac button{border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:6px;padding:4px 7px;font:inherit;margin-inline-start:2px}
.ac .x{color:var(--bad)}
.emp{color:var(--mu);text-align:center;padding:10px}
h2{font-size:16px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.badge{background:var(--pr);color:#fff;border-radius:20px;padding:4px 12px;font-weight:700;font-size:13px}
.ex{border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:8px;background:var(--in)}
.ex small{color:var(--mu)}
.tag{display:inline-block;border-radius:12px;padding:1px 8px;font-size:12px;background:#fff0c9;color:#7a5600}
.tag.ok{background:#d9f0e3;color:#14633f}.tag.no{background:#fbdcd8;color:#9b2c22}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-bottom:8px}
.stats div{background:var(--pr2);border-radius:10px;padding:8px 2px;font-size:12px;color:var(--mu)}
.stats b{display:block;font-size:20px;color:var(--pr)}
.msg{color:var(--bad);font-size:13px;margin:4px 0}
</style>

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function cl(o){return JSON.parse(JSON.stringify(o))}
/* ---------- التخزين ---------- */
function lsLoad(){try{var o=JSON.parse(localStorage.getItem(K));if(o&&o.mosque){C=Object.assign(DEF(),o);delete C.ex;delete C.nt;EX=o.ex||[];NT=o.nt||[]}}catch(e){}}
function lsSave(){try{var o=cl(C);o.ex=EX;o.nt=NT;localStorage.setItem(K,JSON.stringify(o))}catch(e){}}
function save(){if(db){db.doc('app/core').set(cl(C)).catch(function(){U.err='تعذّر الحفظ المشترك: تحقّق من اتصال الإنترنت';r()})}else lsSave()}
function saveD(){clearTimeout(tmr);tmr=setTimeout(save,600)}
function busy(){var a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)}
var late=false;document.addEventListener('focusout',function(){if(late){late=false;setTimeout(r,50)}});
function remote(){if(busy())late=true;else r()}
function initDb(){
  var t=setTimeout(function(){},10000);
  window.claude&&claude.use&&claude.use('db').then(function(d){
    clearTimeout(t);if(!d)return;db=d;
    db.doc('app/core').onSnapshot(function(s){if(s.exists){C=Object.assign(DEF(),cl(s.data()))}remote()},function(){});
    db.collection('excuses').onSnapshot(function(q){EX=q.docs.map(function(x){return cl(x.data())});remote()},function(){});
    db.collection('notes').onSnapshot(function(q){NT=q.docs.map(function(x){return cl(x.data())});remote()},function(){});
    r();
  }).catch(function(){});
}
function addEx(e){if(db){db.doc('excuses/'+e.id).set(e).catch(function(){U.err='تعذّر إرسال العذر: تحقّق من اتصال الإنترنت';r()})}else{EX.push(e);lsSave()}}
function setEx(id,st){
  var e=EX.find(function(x){return x.id===id});if(!e)return;e.st=st;
  if(st==='ok'&&e.type==='student'){rec(e.pid,e.date).s=3;save()}
  if(db)db.doc('excuses/'+id).update({st:st}).catch(function(){});else lsSave();
  r();
}
/* ---------- الحالة ---------- */
function H(){return C[U.tab]}
function other(){return U.tab==='mosque'?'school':'mosque'}
function rec(id,d){var a=C.att[d||U.date]=C.att[d||U.date]||{};return a[id]=a[id]||{s:0,h:'',n:''}}
function all(kind){return C.mosque[kind].map(function(x){return{o:x,h:'مسجد'}}).concat(C.school[kind].map(function(x){return{o:x,h:'مدرسة'}}))}
function go(role){U.vp='';U.pid='';U.role=role;U.ask=null;U.err='';U.info='';r()}
function hs(s){s=String(s||'').trim();if(s.length<3)return Promise.resolve('');
  try{return crypto.subtle.digest('SHA-256',new TextEncoder().encode('halaqa-c|'+s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return('0'+x.toString(16)).slice(-2)}).join('')})}catch(e){return Promise.resolve('x'+s)}}
function login(role){
  var code=document.getElementById('code').value.trim();
  if(role==='sup'){if(code===C.codes.sup){go('sup')}else{U.err='الرمز غير صحيح';r()}return}
  var id=document.getElementById('tn').value,f=all('teachers').find(function(x){return x.o.id===id});
  if(!f){U.err='اختر اسمك من القائمة';r();return}
  Promise.all([hs(code),hp(document.getElementById('tph').value)]).then(function(a){
    var ok=(f.o.ck&&a[0]===f.o.ck)||(code===C.codes.tea&&f.o.ph&&a[1]===f.o.ph);
    if(ok){U.me=id;go('tea')}else{U.err='بيانات الدخول غير صحيحة';r()}
  });
}
function ask(role){U.ask=role;U.err='';r()}
function tab(t){U.tab=t;U.pend=null;r()}
function norm(p){var s=String(p||'').replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632}).replace(/\D/g,'');return s.slice(-8)}
function hp(p){var d=norm(p);if(d.length<8)return Promise.resolve('');
  try{return crypto.subtle.digest('SHA-256',new TextEncoder().encode('halaqa|'+d)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return('0'+x.toString(16)).slice(-2)}).join('')})}catch(e){return Promise.resolve('x'+d)}}
function add(kind){
  var i=document.getElementById('nm-'+kind),v=i.value.trim();if(!v)return;
  var pv=document.getElementById('ph-'+kind).value;
  if(pv.trim()&&norm(pv).length<8){U.err='رقم الهاتف يجب أن يكون 8 أرقام';r();return}
  hp(pv).then(function(h){
    var o={id:uid(),name:v,ph:h,p4:h?norm(pv).slice(-4):''};
    if(kind==='students'){var g=document.getElementById('gs');o.g=g?+g.value:1}
    U.err='';H()[kind].push(o);save();r();
  });
}
function setCk(id,v){v=v.trim();if(!v)return;if(v.length<3){U.err='الرمز لا يقل عن 3 خانات';r();return}
  hs(v).then(function(h){var x=H().teachers.find(function(y){return y.id===id});if(x){x.ck=h;U.err='';U.info='تم تعيين الرمز الخاص ✓';save();r()}})}
function ckCell(o){return U.role==='sup'?'<td><input style="min-width:80px" placeholder="'+(o.ck?'•••• مُعيَّن':'رمز خاص')+'" onchange="setCk(\''+o.id+'\',this.value)"></td>':'<td>'+(o.ck?'✓':'—')+'</td>'}
function setPlan(id,v){C.plans[id]=v;saveD()}
function planCell(s){return '<td><input style="min-width:130px" value="'+esc(C.plans[s.id]||'')+'" placeholder="مثال: سورة النبأ 1-20" oninput="setPlan(\''+s.id+'\',this.value)"></td>'}
function addNt(e){if(db){db.doc('notes/'+e.id).set(e).catch(function(){U.err='تعذّر الإرسال: تحقّق من اتصال الإنترنت';r()})}else{NT.push(e);lsSave()}}
function setNt(id,st){if(U.role!=='sup')return;var e=NT.find(function(x){return x.id===id});if(!e)return;e.st=st;if(db)db.doc('notes/'+id).update({st:st}).catch(function(){});else lsSave();r()}
function sendNt(){
  var p=document.getElementById('nt-p').value,x=document.getElementById('nt-t').value.trim();
  if(!p||!x){U.err='اختر الطالب واكتب الملاحظة';r();return}
  var f=all('students').find(function(z){return z.o.id===p});if(!f)return;
  var sup=U.role==='sup';
  addNt({id:uid(),pid:p,name:f.o.name,hal:f.h,t:x,by:sup?'sup':'tea',st:sup?'shown':'new',at:Date.now()});
  U.err='';U.info=sup?'تمت الإضافة وظهرت للطالب ✓':'أُرسلت الملاحظة إلى المشرف ✓';r();
}
function ntCard(){
  var sup=U.role==='sup',l=NT.slice().sort(function(a,b){return b.at-a.at});
  var o='<div class="card"><h2>'+(sup?'ملاحظات الطلاب (إظهارها للطالب بقرارك)':'رفع ملاحظة عن طالب إلى المشرف')+'</h2>'
   +'<div class="row"><select id="nt-p" class="g">'+opts('students','')+'</select></div><textarea id="nt-t" placeholder="'+(sup?'اكتب ملاحظة تظهر للطالب':'اكتب الملاحظة (تصل إلى المشرف ولا تظهر للطالب إلا بقراره)')+'"></textarea>'
   +'<div class="row" style="margin-top:8px"><button class="b" onclick="sendNt()">'+(sup?'إضافة وإظهار للطالب':'إرسال إلى المشرف')+'</button></div>';
  l.forEach(function(n){
    var tg=n.st==='shown'?'<span class="tag ok">ظاهرة للطالب</span>':n.st==='hidden'?'<span class="tag no">مخفية</span>':'<span class="tag">بانتظار قرار المشرف</span>';
    o+='<div class="ex"><b>'+esc(n.name)+'</b> <small>(حلقة '+esc(n.hal)+' — من '+(n.by==='sup'?'المشرف':'المعلم')+')</small> '+tg+'<div>'+esc(n.t)+'</div>'
     +(sup?'<div class="row" style="margin:6px 0 0">'+(n.st!=='shown'?'<button class="b" onclick="setNt(\''+n.id+'\',\'shown\')">إظهار للطالب</button>':'')+(n.st!=='hidden'?'<button class="b s" onclick="setNt(\''+n.id+'\',\'hidden\')">إخفاء</button>':'')+'</div>':'')+'</div>';
  });
  return o+'</div>';
}
function exportXlsx(){
  if(U.role!=='sup')return;
  if(typeof XLSX==='undefined'){U.err='تعذّر تحميل مكتبة Excel، تحقق من الاتصال بالإنترنت';r();return}
  var m={};
  [['مسجد','mosque'],['مدرسة','school']].forEach(function(h){['students','teachers'].forEach(function(k){C[h[1]][k].forEach(function(x){m[x.id]={n:x.name,h:h[0],t:k==='students'?'طالب':'معلم',g:k==='students'?'المجموعة '+(x.g||1):''}})})});
  var A=[['التاريخ','الحلقة','النوع','الاسم','المجموعة','الحالة','الحفظ','ملاحظات داخلية']],S={};
  Object.keys(C.att).sort().forEach(function(d){Object.keys(C.att[d]).forEach(function(id){
    var p=m[id],x=C.att[d][id];if(!p||!(x.s||x.h||x.n))return;
    A.push([d,p.h,p.t,p.n,p.g,L[x.s]||'',x.h||'',x.n||'']);
    var q=S[id]=S[id]||[p.n,p.h,p.t,0,0,0,0];if(x.s)q[2+x.s]++;
  })});
  var Sm=[['الاسم','الحلقة','النوع','حاضر','متأخر','معذور','غائب']];Object.keys(S).forEach(function(k){Sm.push(S[k])});
  var st={new:'جديد',ok:'مقبول',no:'مرفوض'};
  var E=[['تاريخ الإرسال','الحلقة','النوع','الاسم','تاريخ الغياب','السبب','الحالة']];
  EX.slice().sort(function(a,b){return a.at-b.at}).forEach(function(e){E.push([new Date(e.at).toLocaleDateString('ar'),e.hal,e.type==='teacher'?'معلم':'طالب',e.name,e.date,e.t,st[e.st]||''])});
  var sh={new:'بانتظار المشرف',shown:'ظاهرة للطالب',hidden:'مخفية'};
  var N=[['تاريخ الملاحظة','الحلقة','الطالب','الملاحظة','من','الحالة']];
  NT.slice().sort(function(a,b){return a.at-b.at}).forEach(function(n){N.push([new Date(n.at).toLocaleDateString('ar'),n.hal,n.name,n.t,n.by==='sup'?'المشرف':'المعلم',sh[n.st]||''])});
  var P=[['الحلقة','الطالب','خطة الأسبوع القادم']];
  Object.keys(m).forEach(function(id){if(m[id].t==='طالب'&&C.plans[id])P.push([m[id].h,m[id].n,C.plans[id]])});
  var wb=XLSX.utils.book_new();
  [['الحضور والغياب',A],['ملخص الحضور',Sm],['الأعذار',E],['الملاحظات',N],['الخطط',P]].forEach(function(s){
    var ws=XLSX.utils.aoa_to_sheet(s[1]);ws['!cols']=s[1][0].map(function(){return{wch:22}});XLSX.utils.book_append_sheet(wb,ws,s[0]);
  });
  wb.Workbook={Views:[{RTL:true}]};
  var buf=XLSX.write(wb,{bookType:'xlsx',type:'array'}),name='حلقة-القرآن-'+td()+'.xlsx';
  if(DL){DL.save({filename:name,data:buf}).then(function(){U.err='';U.info='تم التنزيل ✓';r()}).catch(function(e){if(e&&e.code!=='declined'){U.err='تعذّر التنزيل';r()}})}
  else{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf]));a.download=name;document.body.appendChild(a);a.click();a.remove();U.info='تم التنزيل ✓';r()}
}
function setPh(kind,id,v){
  if(!v.trim())return;
  if(norm(v).length<8){U.err='رقم الهاتف يجب أن يكون 8 أرقام';r();return}
  hp(v).then(function(h){var x=H()[kind].find(function(y){return y.id===id});if(x){x.ph=h;x.p4=norm(v).slice(-4);U.err='';save();r()}});
}
function phCell(kind,o){return '<td><input style="min-width:95px" inputmode="numeric" placeholder="'+(o.ph?'••••'+esc(o.p4):'أدخل الرقم')+'" onchange="setPh(\''+kind+'\',\''+o.id+'\',this.value)"></td>'}
function mv(kind,id,d){
  var a=H()[kind],i=a.findIndex(function(x){return x.id===id}),j=i+d;
  while(j>=0&&j<a.length&&kind==='students'&&a[j].g!==a[i].g)j+=d;
  if(j<0||j>=a.length)return;
  var t=a[i];a[i]=a[j];a[j]=t;save();r();
}
function tr(kind,id){
  var a=H()[kind],i=a.findIndex(function(x){return x.id===id});if(i<0)return;
  var o=a.splice(i,1)[0];if(kind==='students')o.g=1;
  C[other()][kind].push(o);save();r();
}
function del(kind,id){
  if(U.pend!==id){U.pend=id;r();return}
  H()[kind]=H()[kind].filter(function(x){return x.id!==id});U.pend=null;save();r();
}
function cyc(id){var x=rec(id);x.s=(x.s+1)%5;save();r()}
function setF(id,f,v){rec(id)[f]=v;saveD()}
function setDate(v){if(v){U.date=v;r()}}
function setTarget(v){H().target=Math.max(0,+v||0);save();r()}
function divide(){
  var h=H(),n=Math.max(1,Math.min(20,+document.getElementById('gn').value||1)),m=h.students.length;
  h.groups=n;h.students.forEach(function(s,i){s.g=m?Math.floor(i*n/m)+1:1});save();r();
}
function chCode(){
  var a=document.getElementById('c-tea').value.trim(),b=document.getElementById('c-sup');
  if(a.length<3){U.err='الرمز لا يقل عن 3 خانات';r();return}
  C.codes.tea=a;if(U.role==='sup'&&b){var s=b.value.trim();if(s.length<3){U.err='الرمز لا يقل عن 3 خانات';r();return}C.codes.sup=s}
  save();U.err='';U.info='تم تغيير الرمز ✓';r();
}
function sendEx(type){
  var t=type==='teacher',d=document.getElementById('ex-d').value,x=document.getElementById('ex-t').value.trim(),p=t?U.me:U.vp;
  if(!p||!d||!x){U.err='اختر الاسم والتاريخ واكتب سبب العذر';r();return}
  var f=all(t?'teachers':'students').find(function(z){return z.o.id===p});if(!f)return;
  var send=function(){addEx({id:uid(),type:type,pid:p,name:f.o.name,hal:f.h,date:d,t:x,st:'new',at:Date.now()});U.err='';U.info='تم إرسال العذر ✓';r()};
  send();return;
  if(!f.o.ph){U.err='لم يُسجَّل رقم لهذا المعلم، اطلب من المشرف إضافته';r();return}
  hp(document.getElementById('ex-ph').value).then(function(h){if(h!==f.o.ph){U.err='رقم الهاتف لا يطابق المسجّل للمعلم';r()}else send()});
}
function verify(){
  var f=all('students').find(function(x){return x.o.id===U.pid});if(!f)return;
  if(!f.o.ph){U.err='لم يُسجَّل رقم ولي الأمر لهذا الطالب، راجع المعلم';r();return}
  hp(document.getElementById('sph').value).then(function(h){if(h===f.o.ph){U.vp=U.pid;U.err=''}else U.err='الرقم غير مطابق لرقم ولي الأمر المسجّل';r()});
}
function setP(v){U.pid=v;U.vp='';U.err='';U.info='';r()}
function opts(kind,sel){
  var o='<option value="">— اختر الاسم —</option>';
  [['مسجد','mosque'],['مدرسة','school']].forEach(function(h){
    if(!C[h[1]][kind].length)return;o+='<optgroup label="حلقة '+h[0]+'">';
    C[h[1]][kind].forEach(function(x){o+='<option value="'+x.id+'"'+(x.id===sel?' selected':'')+'>'+esc(x.name)+'</option>'});o+='</optgroup>';
  });return o;
}
/* ---------- العرض ---------- */
function stBtn(id){var x=rec(id);return '<button class="st'+(x.s?' a'+x.s:'')+'" onclick="cyc(\''+id+'\')">'+(L[x.s]||'—')+'</button>'}
function count(arr){var c=0;arr.forEach(function(x){var s=rec(x.id).s;if(s===1||s===2)c++});return c}
function acts(kind,id){
  var p=U.pend===id;
  return '<td class="ac"><button onclick="mv(\''+kind+'\',\''+id+'\',-1)">▲</button><button onclick="mv(\''+kind+'\',\''+id+'\',1)">▼</button><button onclick="tr(\''+kind+'\',\''+id+'\')">⇄ '+(U.tab==='mosque'?'للمدرسة':'للمسجد')+'</button><button class="x" onclick="del(\''+kind+'\',\''+id+'\')">'+(p?'تأكيد؟':'✕')+'</button></td>';

   +(U.err?'<div class="msg">'+esc(U.err)+'</div>':'')+(U.info?'<div class="msg" style="color:var(--pr)">'+esc(U.info)+'</div>':'');

function home(){
  var o='<div class="card"><h2>اختر دخولك</h2>';
  o+='<button class="b big" onclick="ask(\'sup\')">🧑‍💼 المشرف</button><button class="b big" onclick="ask(\'tea\')">📖 المعلم</button><button class="b big s" onclick="go(\'stu\')">🎒 الطالب</button>';

  var t=type==='teacher';

function staff(){
  var h=H(),n=0,m=U.tab==='mosque',o=head();
  o+='<div class="tabs"><button class="'+(m?'on':'')+'" onclick="tab(\'mosque\')">حلقة المسجد</button><button class="'+(m?'':'on')+'" onclick="tab(\'school\')">حلقة المدرسة</button></div>';
  var go_='';for(var g=1;g<=h.groups;g++)go_+='<option value="'+g+'">المجموعة '+g+'</option>';
  o+='<div class="card"><div class="row"><label>التاريخ</label><input type="date" value="'+U.date+'" onchange="setDate(this.value)"></div>'
   +'<div class="row"><label>هدف عدد الطلاب</label><input class="n" type="number" min="0" value="'+h.target+'" onchange="setTarget(this.value)"><span class="sum">الحالي: <b>'+h.students.length+'</b> من <b>'+h.target+'</b>'+(h.target>h.students.length?' (متبقي '+(h.target-h.students.length)+')':'')+'</span></div>'
   +'<div class="row"><label>عدد المجموعات</label><input class="n" id="gn" type="number" min="1" max="20" value="'+h.groups+'"><button class="b s" onclick="divide()">تقسيم الطلاب إلى مجموعات</button></div>'
   +'<div class="sum">حضور اليوم — طلاب: <b>'+count(h.students)+'</b> / '+h.students.length+' ، معلمون: <b>'+count(h.teachers)+'</b> / '+h.teachers.length+'</div></div>';
  o+='<div class="card"><h2>الطلاب</h2><div class="row"><input class="g" id="nm-students" placeholder="اسم الطالب" onkeydown="if(event.key===\'Enter\')add(\'students\')"><input id="ph-students" inputmode="numeric" placeholder="هاتف ولي الأمر" style="width:130px"><select id="gs">'+go_+'</select><button class="b" onclick="add(\'students\')">+ إضافة</button></div>';
  if(!h.students.length)o+='<div class="emp">لا يوجد طلاب بعد</div>';
  else{
    o+='<div class="ov"><table><tr><th>#</th><th>الاسم</th><th>الحضور</th><th>الحفظ</th><th>ملاحظات داخلية</th><th>خطة الأسبوع القادم</th><th>هاتف ولي الأمر</th><th>إجراءات</th></tr>';
    for(var g=1;g<=h.groups;g++){
      var gs=h.students.filter(function(s){return (s.g>h.groups?h.groups:s.g||1)===g});if(!gs.length)continue;
      o+='<tr class="gh"><td colspan="8">المجموعة '+g+' ('+gs.length+')</td></tr>';
      gs.forEach(function(s){
        n++;var x=rec(s.id);
        o+='<tr><td>'+n+'</td><td>'+esc(s.name)+'</td><td>'+stBtn(s.id)+'</td><td><input value="'+esc(x.h)+'" placeholder="الحفظ" oninput="setF(\''+s.id+'\',\'h\',this.value)"></td><td><input value="'+esc(x.n)+'" placeholder="ملاحظات" oninput="setF(\''+s.id+'\',\'n\',this.value)"></td>'+planCell(s)+phCell('students',s)+acts('students',s.id)+'</tr>';
      });
    }
    o+='</table></div>';
  }
  o+='</div><div class="card"><h2>المعلمون</h2><div class="row"><input class="g" id="nm-teachers" placeholder="اسم المعلم" onkeydown="if(event.key===\'Enter\')add(\'teachers\')"><input id="ph-teachers" inputmode="numeric" placeholder="رقم الهاتف" style="width:130px"><button class="b" onclick="add(\'teachers\')">+ إضافة</button></div>';
  if(!h.teachers.length)o+='<div class="emp">لا يوجد معلمون بعد</div>';
  else{
    o+='<div class="ov"><table><tr><th>#</th><th>الاسم</th><th>الحضور</th><th>الهاتف</th><th>الرمز الخاص</th><th>إجراءات</th></tr>';
    h.teachers.forEach(function(t,i){o+='<tr><td>'+(i+1)+'</td><td>'+esc(t.name)+'</td><td>'+stBtn(t.id)+'</td>'+phCell('teachers',t)+ckCell(t)+acts('teachers',t.id)+'</tr>'});
    o+='</table></div>';
  }
  o+='</div>'+exCard(U.role==='sup'?['student','teacher']:['student'],'أعذار الطلاب'+(U.role==='sup'?' والمعلمين':''));
  o+=ntCard();if(U.role==='tea')o+=exForm('teacher');
  if(U.role==='sup')o+='<div class="card"><h2>تصدير إلى Excel</h2><div class="row"><button class="b" onclick="exportXlsx()">⬇️ تنزيل الحضور والغياب والأعذار والملاحظات</button></div><div class="sum">ملف واحد فيه أوراق: الحضور والغياب، ملخص الحضور، الأعذار، الملاحظات، الخطط</div></div>';
  o+='<div class="card"><h2>تغيير الرمز</h2><div class="row">'+(U.role==='sup'?'<label>رمز المشرف</label><input id="c-sup" value="'+esc(C.codes.sup)+'" class="n" style="width:90px">':'')+'<label>رمز المعلم</label><input id="c-tea" value="'+esc(C.codes.tea)+'" style="width:90px"><button class="b" onclick="chCode()">حفظ</button></div></div>';
  o+='<div class="sum" style="justify-content:center;color:#fff">اضغط على زر الحضور للتبديل: حاضر ← متأخر ← معذور ← غائب</div>';
  return o;
}
function student(){
  var o=head(),sel=U.pid;
  var st=all('students').find(function(x){return x.o.id===sel});
  o+='<div class="card"><h2>صفحة الطالب</h2><select id="sp" style="width:100%" onchange="setP(this.value)">'+opts('students',sel)+'</select>'+(st&&U.vp!==sel?'<div class="row" style="margin-top:8px"><input id="sph" type="tel" inputmode="numeric" placeholder="رقم هاتف ولي الأمر" class="g" onkeydown="if(event.key===\'Enter\')verify()"><button class="b" onclick="verify()">تأكيد</button></div><div class="sum">للتأكد من هويتك، أدخل رقم ولي الأمر المسجّل لدى الحلقة</div>':'')+'</div>';
  if(!db)o+='<div class="card msg">الاتصال المشترك غير متاح حالياً، لذلك لن يصل العذر إلى المعلم. تحقّق من الإنترنت وأعد فتح الصفحة.</div>';
  if(!st||U.vp!==sel)return o;
  var c={p:0,l:0,e:0,a:0},notes=[];
  Object.keys(C.att).sort().reverse().forEach(function(d){
    var x=C.att[d][sel];if(!x)return;
    if(x.s===1)c.p++;else if(x.s===2){c.p++;c.l++}else if(x.s===3)c.e++;else if(x.s===4)c.a++;
    if(x.n||x.h)notes.push({d:d,h:x.h,n:x.n});
  });
  o+='<div class="card"><h2>'+esc(st.o.name)+' <small style="color:var(--mu)">— حلقة '+st.h+'</small></h2><div class="stats"><div><b>'+c.p+'</b>مرات الحضور</div><div><b>'+c.l+'</b>تأخر</div><div><b>'+c.e+'</b>بعذر</div><div><b>'+c.a+'</b>غياب</div></div>';
  o+='</div><div class="card"><h2>📅 خطتك للأسبوع القادم</h2>'+(C.plans[sel]?'<div style="white-space:pre-wrap">'+esc(C.plans[sel])+'</div>':'<div class="emp">لم تُحدَّد الخطة بعد</div>')+'</div>';
  var sn=NT.filter(function(n){return n.pid===sel&&n.st==='shown'}).sort(function(a,b){return b.at-a.at});
  o+='<div class="card"><h2>ملاحظات من الإدارة</h2>';
  if(!sn.length)o+='<div class="emp">لا توجد ملاحظات</div>';
  sn.forEach(function(n){o+='<div class="ex"><small>'+esc(new Date(n.at).toLocaleDateString('ar'))+'</small><div>'+esc(n.t)+'</div></div>'});
  var hl=notes.filter(function(x){return x.h});
  if(hl.length){o+='<h2 style="margin-top:10px">سجل الحفظ</h2>';hl.forEach(function(x){o+='<div class="ex"><small>'+esc(x.d)+'</small> '+esc(x.h)+'</div>'})}
  o+='</div>'+exForm('student');
  var mine=EX.filter(function(e){return e.pid===sel&&e.type==='student'}).sort(function(a,b){return b.at-a.at});
  if(mine.length){o+='<div class="card"><h2>أعذاري</h2>';mine.forEach(function(e){o+='<div class="ex"><small>'+esc(e.date)+'</small> '+(e.st==='ok'?'<span class="tag ok">مقبول</span>':e.st==='no'?'<span class="tag no">مرفوض</span>':'<span class="tag">قيد المراجعة</span>')+'<div>'+esc(e.t)+'</div></div>'});o+='</div>'}
  return o;
}
function r(){
  document.getElementById('app').innerHTML=!U.role?home():U.role==='stu'?student():staff();
}
/* ---------- الخلفية المتحركة ---------- */
(function(){
  if(!IMGS.length)return;
  var el=document.querySelectorAll('#bg i'),k=0,cur=0;
  function show(){var e=el[cur];e.style.backgroundImage='url('+IMGS[k%IMGS.length]+')';e.classList.remove('on');void e.offsetWidth;e.classList.add('on');el[1-cur].classList.remove('on');cur=1-cur;k++}
  show();setInterval(show,3000);
})();
lsLoad();r();initDb();
window.claude&&claude.use&&claude.use('downloads').then(function(d){DL=d}).catch(function(){});
</script>
